<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geodetische & Hydrografische HUD</title>
    <style>
        :root {
            --bg-dark: #1e1e24;
            --panel-bg: #2b2b36;
            --accent-orange: #ff6b4a;
            --accent-purple: #8a2be2;
            --accent-green: #4ade80;
            --accent-cyan: #00f5d4;
            --accent-blue: #00bbf9;
            --accent-yellow: #fee440;
            --text-light: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 210px;
            min-width: 190px;
            background-color: var(--panel-bg);
            border-right: 1px solid #3d3d4a;
            padding: 6px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            overflow-y: auto;
        }

        h2 { margin: 0 0 2px 0; font-size: 10px; letter-spacing: 0.5px; color: var(--accent-orange); }
        
        .control-group {
            background: #1e1e24;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #3d3d4a;
        }

        .control-group label {
            display: block;
            font-size: 8.5px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #aaa;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 3px;
        }

        /* Specifieke grid voor de zoomknoppen */
        .zoom-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            margin-bottom: 4px;
        }

        button {
            width: 100%;
            padding: 4px 5px;
            margin-bottom: 3px;
            background-color: #315273;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 9px;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button:hover { background-color: #3a638c; }
        button.active { background-color: #2e8b57; }
        button.danger { background-color: #b91c1c; }
        button.danger:hover { background-color: #dc2626; }

        select, input[type="range"], input[type="number"] {
            width: 100%;
            padding: 3px;
            background: #2b2b36;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            margin-bottom: 4px;
            box-sizing: border-box;
            font-size: 9px;
        }

        optgroup {
            background: #1e1e24;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .data-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5px;
            color: var(--accent-green);
            background: #000;
            padding: 4px;
            border-radius: 3px;
            min-height: 20px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.25;
        }

        #viewport {
            flex-grow: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #feed-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }

        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
            z-index: 2;
        }

        /* === VOLLEDIGE SPECTRALE & SENSOR FILTERSET === */
        .filter-none        { filter: contrast(110%) brightness(102%); }
        .filter-sun-solar  { filter: contrast(240%) brightness(85%) sepia(85%) hue-rotate(-20deg) saturate(320%); }
        .filter-sun-halpha { filter: contrast(300%) brightness(70%) saturate(600%) hue-rotate(330deg) drop-shadow(0 0 4px #ff0033); }
        .filter-sun-nd     { filter: brightness(35%) contrast(350%) grayscale(40%) sepia(30%); }
        .filter-moon-lumi  { filter: contrast(170%) brightness(125%) hue-rotate(180deg) saturate(35%); }
        .filter-moon-lpr   { filter: contrast(200%) brightness(110%) hue-rotate(200deg) saturate(180%) invert(5%); }
        .filter-moon-ir    { filter: grayscale(100%) brightness(140%) contrast(220%); }
        .filter-night-gen3 { filter: brightness(145%) contrast(200%) sepia(100%) hue-rotate(80deg) saturate(450%); }
        .filter-flir-iron  { filter: contrast(260%) brightness(95%) saturate(400%) hue-rotate(260deg) invert(20%); }
        .filter-flir-white { filter: grayscale(100%) invert(100%) contrast(280%) brightness(115%); }
        .filter-mono-edge  { filter: grayscale(100%) contrast(400%) brightness(90%); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 26vh; }
            #viewport { height: 74vh; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>SURVEY HUD</h2>
        
        <!-- 1. LIVEFEED STREAMS -->
        <div class="control-group">
            <label>1. Live Streams & Viewport</label>
            <div class="btn-grid">
                <button id="btn-toggle-camera">Camera</button>
                <button id="btn-toggle-screen">Scherm</button>
            </div>
            <div class="btn-grid">
                <button id="btn-toggle-fullscreen">Full</button>
                <button id="btn-toggle-pip">PiP</button>
            </div>
        </div>

        <!-- 2. SENSOREN -->
        <div class="control-group">
            <label>2. Sensoren (Azimut)</label>
            <button id="btn-enable-sensor">📱 Activeer Sensor</button>
            <select id="baud-rate">
                <option value="4800">4800 Baud</option>
                <option value="9600">9600 Baud</option>
                <option value="38400">38400 Baud</option>
                <option value="115200">115200 Baud</option>
            </select>
            <button id="btn-connect-serial">Serial API</button>
            <div class="data-display" id="serial-output">Sensor: Stand-by</div>
        </div>

        <!-- 3. VOLLEDIG SPECTRUM FILTERS & ZOOM -->
        <div class="control-group">
            <label>3. Spectraalfilters & Sharp-Zoom</label>
            <select id="filter-selector">
                <option value="filter-none">Standaard (Scherpte Boost)</option>
                <optgroup label="☀️ Zon- & Eclipsfilters">
                    <option value="filter-sun-solar">☀️ Zonnefilter</option>
                    <option value="filter-sun-halpha">🔴 H-Alpha 656nm</option>
                    <option value="filter-sun-nd">🌑 Eclips ND-Filter</option>
                </optgroup>
                <optgroup label="🌙 Maan- & Astrometriefilters">
                    <option value="filter-moon-lumi">🌙 Maanfilter</option>
                    <option value="filter-moon-lpr">🌌 LPR-Filter</option>
                    <option value="filter-moon-ir">📡 Infrarood Pass</option>
                </optgroup>
                <optgroup label="🟢 Nachtzicht & Sensorfilters">
                    <option value="filter-night-gen3">🟢 Nachtzicht Gen-3</option>
                    <option value="filter-flir-iron">🔥 FLIR Thermisch</option>
                    <option value="filter-flir-white">⚪ White-Hot Thermisch</option>
                    <option value="filter-mono-edge">📐 Monochroom Contour</option>
                </optgroup>
            </select>
            
            <div style="display:flex; justify-content:space-between; font-size:8px; color:#aaa; margin-top:4px;">
                <span>Zoom Presets:</span>
            </div>
            
            <!-- Nieuwe Zoom Knoppen -->
            <div class="zoom-grid">
                <button class="zoom-btn" data-zoom="1">1x</button>
                <button class="zoom-btn" data-zoom="2">2x</button>
                <button class="zoom-btn" data-zoom="5">5x</button>
                <button class="zoom-btn" data-zoom="10">10x</button>
                <button class="zoom-btn" data-zoom="15">15x</button>
            </div>

            <div style="display:flex; justify-content:space-between; font-size:8px; color:#aaa;">
                <span>Fijn-afstelling:</span><span id="zoom-val" style="color:var(--accent-orange); font-weight:bold;">1x</span>
            </div>
            <input type="range" id="zoom-slider" min="1" max="15" step="0.5" value="1">
            
            <div class="checkbox-container" style="display:flex; align-items:center; gap:4px; margin-top:2px;">
                <input type="checkbox" id="chk-auto-sharpness" checked style="width:auto; margin:0;">
                <label for="chk-auto-sharpness" style="font-size:8px; color:#ddd; margin:0;">Adaptieve Anti-Blur</label>
            </div>
        </div>

        <!-- 4. CAPTURE & RECORDING -->
        <div class="control-group">
            <label>4. Opname</label>
            <div class="btn-grid">
                <button id="btn-take-photo">📸 Foto</button>
                <button id="btn-record-video">🎥 Record</button>
            </div>
            <div class="data-display" id="capture-status">Stand-by</div>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div id="viewport">
        <div id="feed-wrapper">
            <video id="video-feed" class="filter-none" autoplay playsinline muted></video>
            <canvas id="layer-hud" class="hud-layer"></canvas>
        </div>
    </div>

    <script>
        // === STATE ENGINE & CONFIGURATIE ===
        let actueleAzimut = 0.0;
        let sensorOffset = 0.0;
        let lastRawHeading = 0.0;
        let isSerialConnected = false;
        let isMobileSensorActive = false;

        let cameraStream = null;
        let screenStream = null;
        let videoTrack = null;
        let cameraCapabilities = null;

        const viewport = document.getElementById('viewport');
        const feedWrapper = document.getElementById('feed-wrapper');
        const video = document.getElementById('video-feed');
        const serialOutput = document.getElementById('serial-output');
        
        const filterSelector = document.getElementById('filter-selector');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');
        const zoomButtons = document.querySelectorAll('.zoom-btn');
        const chkAutoSharpness = document.getElementById('chk-auto-sharpness');
        const captureStatus = document.getElementById('capture-status');
        
        const btnToggleCamera = document.getElementById('btn-toggle-camera');
        const btnToggleScreen = document.getElementById('btn-toggle-screen');
        const btnEnableSensor = document.getElementById('btn-enable-sensor');

        const hudCanvas = document.getElementById('layer-hud');
        const hudCtx = hudCanvas.getContext('2d');

        function resizeAllLayers() {
            const dpr = window.devicePixelRatio || 1;
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;

            hudCanvas.width = w * dpr;
            hudCanvas.height = h * dpr;
            hudCanvas.style.width = `${w}px`;
            hudCanvas.style.height = `${h}px`;
            hudCtx.setTransform(1, 0, 0, 1, 0, 0);
            hudCtx.scale(dpr, dpr);
            hudCtx.imageSmoothingEnabled = true;
            hudCtx.imageSmoothingQuality = 'high';
        }
        window.addEventListener('resize', resizeAllLayers);
        resizeAllLayers();

        // === 1. LIVEFEED STREAMS ===
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
                videoTrack = null;
                cameraCapabilities = null;
            }
            if (video.srcObject && !screenStream) video.srcObject = null;
            btnToggleCamera.classList.remove('danger');
            btnToggleCamera.innerText = 'Camera';
        }

        btnToggleCamera.addEventListener('click', async () => {
            if (cameraStream) {
                stopCamera();
            } else {
                try {
                    if (screenStream) stopScreenShare();
                    cameraStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: "environment", 
                            width: { ideal: 3840, min: 1920 }, 
                            height: { ideal: 2160, min: 1080 }
                        } 
                    });
                    video.srcObject = cameraStream;
                    videoTrack = cameraStream.getVideoTracks()[0];
                    if (videoTrack.getCapabilities) cameraCapabilities = videoTrack.getCapabilities();

                    btnToggleCamera.classList.add('danger');
                    btnToggleCamera.innerText = 'Stop Cam';
                    applySharpZoom();
                } catch (err) { alert("Camera fout: " + err.message); }
            }
        });

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            if (video.srcObject && !cameraStream) video.srcObject = null;
            btnToggleScreen.classList.remove('danger');
            btnToggleScreen.innerText = 'Scherm';
        }

        btnToggleScreen.addEventListener('click', async () => {
            if (screenStream) {
                stopScreenShare();
            } else {
                try {
                    if (cameraStream) stopCamera();
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60 }, audio: false });
                    video.srcObject = screenStream;
                    btnToggleScreen.classList.add('danger');
                    btnToggleScreen.innerText = 'Stop Deel';
                    screenStream.getVideoTracks()[0].onended = stopScreenShare;
                } catch (err) { console.error(err); }
            }
        });

        // === 2. DYNAMISCHE 3D ORIËNTATIE ===
        function computeTrueHeading(e) {
            if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) return e.webkitCompassHeading;
            if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
                const degToRad = Math.PI / 180;
                const alpha = e.alpha * degToRad;
                const beta = e.beta * degToRad;
                const gamma = e.gamma * degToRad;

                const cA = Math.cos(alpha), sA = Math.sin(alpha);
                const cB = Math.cos(beta),  sB = Math.sin(beta);
                const cG = Math.cos(gamma), sG = Math.sin(gamma);

                const rA = -cA * sG - sA * sB * cG;
                const rB = -sA * sG + cA * sB * cG;

                let compassHeading = Math.atan2(rA, rB) * (180 / Math.PI);
                if (compassHeading < 0) compassHeading += 360;

                const screenAngle = (window.screen && window.screen.orientation) ? window.screen.orientation.angle : (window.orientation || 0);
                compassHeading = (compassHeading + screenAngle) % 360;
                return compassHeading;
            }
            return null;
        }

        function handleOrientation(event) {
            const heading = computeTrueHeading(event);
            if (heading !== null && !isNaN(heading)) {
                lastRawHeading = heading;
                actueleAzimut = (lastRawHeading + sensorOffset + 360) % 360;
                isMobileSensorActive = true;
                serialOutput.innerText = `[Live Sensor] Azimut: ${actueleAzimut.toFixed(1)}°`;
            }
        }

        async function initSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        btnEnableSensor.classList.add('active');
                        btnEnableSensor.innerText = '📱 Sensor Actief';
                    }
                } catch (e) { console.error(e); }
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
                btnEnableSensor.classList.add('active');
                btnEnableSensor.innerText = '📱 Sensor Actief';
            }
        }

        btnEnableSensor.addEventListener('click', async () => {
            sensorOffset = 0.0;
            await initSensor();
        });

        document.getElementById('btn-connect-serial').addEventListener('click', async (e) => {
            if (!("serial" in navigator)) return alert("Web Serial vereist Chrome/Edge.");
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: parseInt(document.getElementById('baud-rate').value) });
                isSerialConnected = true;
                e.target.classList.add('active');
                const decoder = new TextDecoderStream();
                port.readable.pipeTo(decoder.writable);
                const reader = decoder.readable.getReader();
                let buf = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += value;
                    const lines = buf.split('\n');
                    buf = lines.pop();
                    for (let l of lines) {
                        if (l.includes('HDT') || l.includes('RMC')) {
                            let p = l.split(',');
                            if (p[1] && !isNaN(parseFloat(p[1]))) {
                                lastRawHeading = parseFloat(p[1]);
                                actueleAzimut = (lastRawHeading + sensorOffset + 360) % 360;
                                serialOutput.innerText = `[NMEA Live] Azimut: ${actueleAzimut.toFixed(1)}°`;
                            }
                        }
                    }
                }
            } catch (err) { console.error(err); }
        });

        // === 3. ZOOM & ADAPTIEVE SHARP ENGINE ===
        function applySharpZoom() {
            const z = parseFloat(zoomSlider.value);
            zoomVal.innerText = z + 'x';

            if (videoTrack && cameraCapabilities && cameraCapabilities.zoom) {
                const hwMin = cameraCapabilities.zoom.min;
                const hwMax = cameraCapabilities.zoom.max;
                const targetHwZoom = Math.min(hwMax, Math.max(hwMin, z));
                videoTrack.applyConstraints({ advanced: [{ zoom: targetHwZoom }] }).catch(() => {});
            }

            feedWrapper.style.transform = `scale(${z})`;
            video.className = filterSelector.value;

            if (chkAutoSharpness.checked && z > 1.5) {
                video.style.imageRendering = z > 8 ? 'pixelated' : 'crisp-edges';
            } else {
                video.style.imageRendering = 'crisp-edges';
            }
        }

        // Koppel de nieuwe zoom knoppen
        zoomButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                zoomSlider.value = e.target.getAttribute('data-zoom');
                applySharpZoom();
            });
        });

        zoomSlider.value = 1;
        applySharpZoom();

        zoomSlider.addEventListener('input', applySharpZoom);
        chkAutoSharpness.addEventListener('change', applySharpZoom);
        filterSelector.addEventListener('change', applySharpZoom);


        // === 4. OPNAME & FOTO ===
        document.getElementById('btn-toggle-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) viewport.requestFullscreen().catch(e => alert(e.message));
            else document.exitFullscreen();
        });

        document.getElementById('btn-toggle-pip').addEventListener('click', async () => {
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else if (video.srcObject) await video.requestPictureInPicture();
            } catch (err) { console.error(err); }
        });

        function getMergedLayersCanvas() {
            const merged = document.createElement('canvas');
            merged.width = viewport.clientWidth * (window.devicePixelRatio || 1);
            merged.height = viewport.clientHeight * (window.devicePixelRatio || 1);
            const mCtx = merged.getContext('2d');
            mCtx.imageSmoothingEnabled = true;
            mCtx.imageSmoothingQuality = 'high';

            if (video.videoWidth > 0 && video.srcObject) {
                mCtx.filter = getComputedStyle(video).filter;
                mCtx.drawImage(video, 0, 0, merged.width, merged.height);
                mCtx.filter = 'none';
            }
            mCtx.drawImage(hudCanvas, 0, 0);
            return merged;
        }

        document.getElementById('btn-take-photo').addEventListener('click', () => {
            const merged = getMergedLayersCanvas();
            const link = document.createElement('a');
            link.download = `Survey_Foto_${Date.now()}.png`;
            link.href = merged.toDataURL('image/png');
            link.click();
            captureStatus.innerText = "Foto opgeslagen (HD)!";
            setTimeout(() => captureStatus.innerText = "Stand-by", 2500);
        });

        let mediaRecorder, recordedChunks = [], isRecording = false;
        const btnRecord = document.getElementById('btn-record-video');
        btnRecord.addEventListener('click', () => {
            if (!isRecording) {
                const merged = document.createElement('canvas');
                merged.width = viewport.clientWidth;
                merged.height = viewport.clientHeight;
                const mCtx = merged.getContext('2d');
                const stream = merged.captureStream(30);

                function renderMergedStream() {
                    if (video.videoWidth > 0 && video.srcObject) {
                        mCtx.filter = getComputedStyle(video).filter;
                        mCtx.drawImage(video, 0, 0, merged.width, merged.height);
                        mCtx.filter = 'none';
                    }
                    mCtx.drawImage(hudCanvas, 0, 0);
                    if (isRecording) requestAnimationFrame(renderMergedStream);
                }

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `Survey_Video_${Date.now()}.webm`;
                    a.click();
                    captureStatus.innerText = "Video gedownload!";
                };

                isRecording = true;
                mediaRecorder.start();
                renderMergedStream();
                btnRecord.classList.add('danger');
                btnRecord.innerText = "Stop Rec";
                captureStatus.innerText = "Opname loopt...";
            } else {
                isRecording = false;
                mediaRecorder.stop();
                btnRecord.classList.remove('danger');
                btnRecord.innerText = "🎥 Record";
            }
        });

        // === 5. HOOFD RENDER LOOP (UITGEKLEDE HUD) ===
        function drawAllLayers() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            const cx = w / 2;
            const cy = h / 2;

            // Simuleer beweging als er geen echte sensor is aangesloten
            if (!isSerialConnected && !isMobileSensorActive) {
                actueleAzimut = (actueleAzimut + 0.03) % 360;
            }

            hudCtx.clearRect(0, 0, w, h);

            // Simpel dradenkruis (Center Crosshair)
            hudCtx.strokeStyle = 'rgba(0, 245, 212, 0.6)';
            hudCtx.lineWidth = 1;
            hudCtx.beginPath();
            hudCtx.moveTo(cx - 15, cy);
            hudCtx.lineTo(cx + 15, cy);
            hudCtx.moveTo(cx, cy - 15);
            hudCtx.lineTo(cx, cy + 15);
            hudCtx.stroke();

            // Azimut Weergave in de HUD
            hudCtx.fillStyle = 'var(--accent-cyan)';
            hudCtx.font = 'bold 12px "Courier New"';
            hudCtx.fillText(`AZIMUT: ${actueleAzimut.toFixed(1)}°`, cx + 25, cy + 5);

            requestAnimationFrame(drawAllLayers);
        }

        drawAllLayers();
    </script>
</body>
</html>
