<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archeo-Astronomie AR HUD | Gelaagde Matrix Engine</title>
    <style>
        :root {
            --bg-dark: #1e1e24;
            --panel-bg: #2b2b36;
            --accent-orange: #ff6b4a;
            --accent-purple: #8a2be2;
            --accent-green: #4ade80;
            --accent-cyan: #00f5d4;
            --accent-blue: #00bbf9;
            --accent-yellow: #fee440;
            --text-light: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 50% Kleiner Zijpaneel */
        #sidebar {
            width: 190px;
            min-width: 180px;
            background-color: var(--panel-bg);
            border-right: 1px solid #3d3d4a;
            padding: 6px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            overflow-y: auto;
        }

        h2 { margin: 0 0 2px 0; font-size: 10px; letter-spacing: 0.5px; color: var(--accent-orange); }
        
        .control-group {
            background: #1e1e24;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #3d3d4a;
        }

        .control-group label {
            display: block;
            font-size: 9px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #aaa;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 3px;
        }

        button {
            width: 100%;
            padding: 4px 5px;
            margin-bottom: 3px;
            background-color: #315273;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 9px;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button:hover { background-color: #3a638c; }
        button.active { background-color: #2e8b57; }
        button.danger { background-color: #b91c1c; }
        button.danger:hover { background-color: #dc2626; }

        select, input[type="range"], input[type="number"] {
            width: 100%;
            padding: 3px;
            background: #2b2b36;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            margin-bottom: 4px;
            box-sizing: border-box;
            font-size: 9px;
        }

        optgroup {
            background: #1e1e24;
            color: var(--accent-orange);
            font-weight: bold;
        }

        .data-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5px;
            color: var(--accent-green);
            background: #000;
            padding: 4px;
            border-radius: 3px;
            min-height: 20px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .layer-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2b2b36;
            padding: 3px 5px;
            border-radius: 3px;
            margin-bottom: 3px;
            font-size: 8.5px;
            border-left: 2px solid #666;
        }

        .layer-toggle.active {
            border-left-color: var(--accent-green);
        }

        .layer-toggle input[type="checkbox"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        /* Viewport Container & Gelaagd Systeem */
        #viewport {
            flex-grow: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #feed-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.05s ease-out;
        }

        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
        }

        #layer-shadow   { z-index: 2; }
        #layer-hydro    { z-index: 3; }
        #layer-survey   { z-index: 4; }
        #layer-matrix   { z-index: 5; }
        #layer-scilab   { z-index: 6; }
        #layer-compass  { z-index: 7; }

        /* Optische Filters */
        .filter-none { filter: none; }
        .filter-sun { filter: contrast(220%) brightness(85%) sepia(80%) hue-rotate(-20deg) saturate(300%); }
        .filter-moon { filter: contrast(160%) brightness(120%) hue-rotate(180deg) saturate(40%); }
        .filter-night { filter: brightness(140%) contrast(180%) tint(green) invert(10%) sepia(100%) hue-rotate(80deg) saturate(400%); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 24vh; }
            #viewport { height: 76vh; }
        }
    </style>
</head>
<body>

    <!-- 50% KLEINER ZIJPANEEL MET CONTROLES -->
    <div id="sidebar">
        <h2>HUD CONSOLE</h2>
        
        <!-- 1. HARDWARE SENSORS & MOBIELE ORIËNTATIE -->
        <div class="control-group">
            <label>1. Sensoren & Kompas</label>
            <button id="btn-enable-sensor">📱 Activeer Sensor</button>
            <select id="baud-rate">
                <option value="4800">4800 Baud</option>
                <option value="9600">9600 Baud</option>
                <option value="38400">38400 Baud</option>
                <option value="115200">115200 Baud</option>
            </select>
            <button id="btn-connect-serial">Serial API</button>
            <div class="data-display" id="serial-output">Sensor: Auto (Sim)</div>
        </div>

        <!-- 2. BEELDINVOER & SCHERMDELEN -->
        <div class="control-group">
            <label>2. Live Streams</label>
            <div class="btn-grid">
                <button id="btn-toggle-camera">Camera</button>
                <button id="btn-toggle-screen">Scherm</button>
            </div>
            <div class="btn-grid">
                <button id="btn-toggle-fullscreen">Full</button>
                <button id="btn-toggle-pip">PiP</button>
            </div>
        </div>

        <!-- 3. LAAGBEHEER -->
        <div class="control-group">
            <label>3. Actieve Lagen</label>
            <div class="layer-toggle active">
                <span>1: Kompas / Balk</span>
                <input type="checkbox" id="chk-layer-compass" checked>
            </div>
            <div class="layer-toggle active">
                <span>2: Archeo Matrix</span>
                <input type="checkbox" id="chk-layer-matrix" checked>
            </div>
            <div class="layer-toggle active">
                <span>3: Scilab 3D Matrix</span>
                <input type="checkbox" id="chk-layer-scilab" checked>
            </div>
            <div class="layer-toggle active">
                <span>4: Tacheometrie</span>
                <input type="checkbox" id="chk-layer-survey" checked>
            </div>
            <div class="layer-toggle active">
                <span>5: Hydrografie</span>
                <input type="checkbox" id="chk-layer-hydro" checked>
            </div>
            <div class="layer-toggle active">
                <span>6: Schaduw Gnomon</span>
                <input type="checkbox" id="chk-layer-shadow" checked>
            </div>
        </div>

        <!-- 4. OPTISCHE FILTERS & TOT 1500X ZOOM -->
        <div class="control-group">
            <label>4. Filters & Zoom (tot 1500x)</label>
            <select id="filter-selector">
                <option value="filter-none">Standaard</option>
                <option value="filter-sun">☀️ Zonnefilter</option>
                <option value="filter-moon">🌙 Maanfilter</option>
                <option value="filter-night">🟢 Nachtzicht</option>
            </select>
            <div style="display:flex; justify-content:space-between; font-size:8.5px; color:#aaa;">
                <span>Zoom:</span><span id="zoom-val" style="color:var(--accent-orange); font-weight:bold;">1.0x</span>
            </div>
            <input type="range" id="zoom-slider" min="1" max="1500" step="0.5" value="1">
        </div>

        <!-- 5. CAPTURE & RECORDING -->
        <div class="control-group">
            <label>5. Opname</label>
            <div class="btn-grid">
                <button id="btn-take-photo">📸 Foto</button>
                <button id="btn-record-video">🎥 Record</button>
            </div>
            <div class="data-display" id="capture-status">Stand-by</div>
        </div>

        <!-- 6. ARCHEO MATRIX (NL & ZWEDEN) -->
        <div class="control-group">
            <label>6. Archeo Matrix</label>
            <select id="target-selector">
                <optgroup label="🇳🇱 Nederland">
                    <option value="13.8" data-name="Orisant (13.8° Maan)">Orisant (13.8°)</option>
                    <option value="137.5" data-name="Nehalennia (137.5° Zon)">Nehalennia (137.5°)</option>
                    <option value="190.5" data-name="Doornik (190.5° Schelde)">Doornik (190.5°)</option>
                    <option value="51.2" data-name="D53 Havelte (51.2° Solstitium)">D53 Havelte (51.2°)</option>
                    <option value="231.5" data-name="D27 Borger (231.5° Winter)">D27 Borger (231.5°)</option>
                    <option value="87.0" data-name="Kootwijk (87.0° Equinox)">Kootwijk (87.0°)</option>
                </optgroup>
                <optgroup label="🇸🇪 Zweden">
                    <option value="134.0" data-name="Ales Stenar (134.0° Winter)">Ales Stenar (134.0°)</option>
                    <option value="314.0" data-name="Ales Stenar (314.0° Zomer)">Ales Stenar (314.0°)</option>
                    <option value="23.5" data-name="Anundshög (23.5°)">Anundshög (23.5°)</option>
                    <option value="180.0" data-name="Gamla Uppsala (180.0°)">Gamla Uppsala (180.0°)</option>
                    <option value="62.3" data-name="Rösaring (62.3° Weg)">Rösaring (62.3°)</option>
                    <option value="208.5" data-name="Gångesteinen (208.5°)">Gångesteinen (208.5°)</option>
                </optgroup>
            </select>
        </div>

        <!-- 7. MOERNEREN BODEMDALING -->
        <div class="control-group">
            <label>7. Moerneren (1300-1600)</label>
            <input type="range" id="time-slider" min="1300" max="1600" value="1300" step="1">
            <div style="display:flex; justify-content:space-between; font-size:8px; color:#aaa;">
                <span>1300</span>
                <span id="year-display" style="color:var(--accent-orange); font-weight:bold;">1300</span>
                <span>1600</span>
            </div>
            <div class="data-display" id="reimerswaal-status">1300: +2.50m NAP</div>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div id="viewport">
        <div id="feed-wrapper">
            <video id="video-feed" autoplay playsinline muted></video>
            
            <canvas id="layer-shadow" class="hud-layer"></canvas>
            <canvas id="layer-hydro" class="hud-layer"></canvas>
            <canvas id="layer-survey" class="hud-layer"></canvas>
            <canvas id="layer-matrix" class="hud-layer"></canvas>
            <canvas id="layer-scilab" class="hud-layer"></canvas>
            <canvas id="layer-compass" class="hud-layer"></canvas>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        // === STATE & MOBIELE COMPASS ENGINE ===
        let actueleAzimut = 0.0;
        let isSerialConnected = false;
        let isMobileSensorActive = false;
        const CAMERA_FOV = 60;

        let cameraStream = null;
        let screenStream = null;

        // DOM Elementen
        const viewport = document.getElementById('viewport');
        const feedWrapper = document.getElementById('feed-wrapper');
        const video = document.getElementById('video-feed');
        const serialOutput = document.getElementById('serial-output');
        const targetSelector = document.getElementById('target-selector');
        const filterSelector = document.getElementById('filter-selector');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');
        const captureStatus = document.getElementById('capture-status');
        const btnToggleCamera = document.getElementById('btn-toggle-camera');
        const btnToggleScreen = document.getElementById('btn-toggle-screen');
        const btnEnableSensor = document.getElementById('btn-enable-sensor');

        const layers = {
            compass: { canvas: document.getElementById('layer-compass'), ctx: document.getElementById('layer-compass').getContext('2d'), chk: document.getElementById('chk-layer-compass') },
            matrix:  { canvas: document.getElementById('layer-matrix'),  ctx: document.getElementById('layer-matrix').getContext('2d'),  chk: document.getElementById('chk-layer-matrix') },
            scilab:  { canvas: document.getElementById('layer-scilab'),  ctx: document.getElementById('layer-scilab').getContext('2d'),  chk: document.getElementById('chk-layer-scilab') },
            survey:  { canvas: document.getElementById('layer-survey'),  ctx: document.getElementById('layer-survey').getContext('2d'),  chk: document.getElementById('chk-layer-survey') },
            hydro:   { canvas: document.getElementById('layer-hydro'),   ctx: document.getElementById('layer-hydro').getContext('2d'),   chk: document.getElementById('chk-layer-hydro') },
            shadow:  { canvas: document.getElementById('layer-shadow'),  ctx: document.getElementById('layer-shadow').getContext('2d'),  chk: document.getElementById('chk-layer-shadow') }
        };

        function resizeAllLayers() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            Object.values(layers).forEach(l => {
                l.canvas.width = w;
                l.canvas.height = h;
            });
        }
        window.addEventListener('resize', resizeAllLayers);
        resizeAllLayers();

        // Checkbox status styling triggers
        Object.values(layers).forEach(layer => {
            layer.chk.addEventListener('change', (e) => {
                const parent = e.target.closest('.layer-toggle');
                if (e.target.checked) {
                    parent.classList.add('active');
                } else {
                    parent.classList.remove('active');
                    layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
                }
            });
        });

        // === 1. MOBIELE COMPASS & GYROSCOOP SENSOR ===
        function handleOrientation(event) {
            let heading = null;
            if (event.webkitCompassHeading !== undefined) {
                // iOS Safari
                heading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                // Android Chrome absolute orientation
                if (event.absolute) {
                    heading = 360 - event.alpha;
                } else {
                    heading = (360 - event.alpha) % 360;
                }
            }

            if (heading !== null && !isNaN(heading)) {
                actueleAzimut = (heading + 360) % 360;
                isMobileSensorActive = true;
                serialOutput.innerText = `[Mobiel] Sensor: ${actueleAzimut.toFixed(1)}°`;
            }
        }

        btnEnableSensor.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        btnEnableSensor.classList.add('active');
                        btnEnableSensor.innerText = '📱 Sensor Actief';
                    }
                } catch (e) {
                    alert('Sensor permissie fout: ' + e.message);
                }
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
                btnEnableSensor.classList.add('active');
                btnEnableSensor.innerText = '📱 Sensor Actief';
            }
        });

        // Automatisch inschakelen op compatibele mobiele apparaten
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        // === 2. CAMERA FEED: START & STOP ===
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            if (video.srcObject && !screenStream) video.srcObject = null;
            btnToggleCamera.classList.remove('danger');
            btnToggleCamera.innerText = 'Camera';
        }

        btnToggleCamera.addEventListener('click', async () => {
            if (cameraStream) {
                stopCamera();
            } else {
                try {
                    if (screenStream) stopScreenShare();
                    cameraStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
                    });
                    video.srcObject = cameraStream;
                    btnToggleCamera.classList.add('danger');
                    btnToggleCamera.innerText = 'Stop Cam';
                } catch (err) {
                    alert("Camera fout: " + err.message);
                }
            }
        });

        // === 3. SCHERM DELEN: START & STOP ===
        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            if (video.srcObject && !cameraStream) video.srcObject = null;
            btnToggleScreen.classList.remove('danger');
            btnToggleScreen.innerText = 'Scherm';
        }

        btnToggleScreen.addEventListener('click', async () => {
            if (screenStream) {
                stopScreenShare();
            } else {
                try {
                    if (cameraStream) stopCamera();
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                    video.srcObject = screenStream;
                    btnToggleScreen.classList.add('danger');
                    btnToggleScreen.innerText = 'Stop Deel';
                    screenStream.getVideoTracks()[0].onended = stopScreenShare;
                } catch (err) {
                    console.error("Schermfout:", err);
                }
            }
        });

        // === 4. VOLLEDIG SCHERM & PIP ===
        document.getElementById('btn-toggle-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) viewport.requestFullscreen().catch(e => alert(e.message));
            else document.exitFullscreen();
        });

        document.getElementById('btn-toggle-pip').addEventListener('click', async () => {
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else if (video.srcObject) await video.requestPictureInPicture();
            } catch (err) { console.error(err); }
        });

        // === 5. TOT 1500X ZOOM & FILTERS ===
        zoomSlider.addEventListener('input', (e) => {
            const z = parseFloat(e.target.value);
            zoomVal.innerText = z >= 10 ? z.toFixed(0) + 'x' : z.toFixed(1) + 'x';
            feedWrapper.style.transform = `scale(${z})`;
        });

        filterSelector.addEventListener('change', (e) => {
            video.className = e.target.value;
        });

        // === 6. CAPTURE & OPNAME ===
        function getMergedLayersCanvas() {
            const merged = document.createElement('canvas');
            merged.width = viewport.clientWidth;
            merged.height = viewport.clientHeight;
            const mCtx = merged.getContext('2d');

            if (video.videoWidth > 0 && video.srcObject) {
                mCtx.filter = getComputedStyle(video).filter;
                mCtx.drawImage(video, 0, 0, merged.width, merged.height);
                mCtx.filter = 'none';
            }

            const layerKeys = ['shadow', 'hydro', 'survey', 'matrix', 'scilab', 'compass'];
            layerKeys.forEach(k => {
                if (layers[k].chk.checked) mCtx.drawImage(layers[k].canvas, 0, 0);
            });
            return merged;
        }

        document.getElementById('btn-take-photo').addEventListener('click', () => {
            const merged = getMergedLayersCanvas();
            const link = document.createElement('a');
            link.download = `Archeo_HUD_${Date.now()}.png`;
            link.href = merged.toDataURL('image/png');
            link.click();
            captureStatus.innerText = "Foto opgeslagen!";
            setTimeout(() => captureStatus.innerText = "Stand-by", 2500);
        });

        let mediaRecorder, recordedChunks = [], isRecording = false;
        const btnRecord = document.getElementById('btn-record-video');
        btnRecord.addEventListener('click', () => {
            if (!isRecording) {
                const merged = document.createElement('canvas');
                merged.width = viewport.clientWidth;
                merged.height = viewport.clientHeight;
                const mCtx = merged.getContext('2d');
                const stream = merged.captureStream(30);

                function renderMergedStream() {
                    if (video.videoWidth > 0 && video.srcObject) {
                        mCtx.filter = getComputedStyle(video).filter;
                        mCtx.drawImage(video, 0, 0, merged.width, merged.height);
                        mCtx.filter = 'none';
                    }
                    ['shadow', 'hydro', 'survey', 'matrix', 'scilab', 'compass'].forEach(k => {
                        if (layers[k].chk.checked) mCtx.drawImage(layers[k].canvas, 0, 0);
                    });
                    if (isRecording) requestAnimationFrame(renderMergedStream);
                }

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `Archeo_Video_${Date.now()}.webm`;
                    a.click();
                    captureStatus.innerText = "Video gedownload!";
                };

                isRecording = true;
                mediaRecorder.start();
                renderMergedStream();
                btnRecord.classList.add('danger');
                btnRecord.innerText = "Stop Rec";
                captureStatus.innerText = "Opname loopt...";
            } else {
                isRecording = false;
                mediaRecorder.stop();
                btnRecord.classList.remove('danger');
                btnRecord.innerText = "🎥 Record";
            }
        });

        // === 7. WEB SERIAL API (NMEA) ===
        document.getElementById('btn-connect-serial').addEventListener('click', async (e) => {
            if (!("serial" in navigator)) return alert("Web Serial vereist Chrome/Edge.");
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: parseInt(document.getElementById('baud-rate').value) });
                isSerialConnected = true;
                e.target.classList.add('active');
                const decoder = new TextDecoderStream();
                port.readable.pipeTo(decoder.writable);
                const reader = decoder.readable.getReader();
                let buf = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += value;
                    const lines = buf.split('\n');
                    buf = lines.pop();
                    for (let l of lines) {
                        if (l.includes('HDT') || l.includes('RMC')) {
                            let p = l.split(',');
                            if (p[1] && !isNaN(parseFloat(p[1]))) {
                                actueleAzimut = parseFloat(p[1]);
                                serialOutput.innerText = `[NMEA] Azimut: ${actueleAzimut.toFixed(1)}°`;
                            }
                        }
                    }
                }
            } catch (err) { console.error(err); }
        });

        // === 8. MOERNEREN CALCULATOR ===
        const timeSlider = document.getElementById('time-slider');
        const yearDisplay = document.getElementById('year-display');
        const reimerswaalStatus = document.getElementById('reimerswaal-status');

        timeSlider.addEventListener('input', (e) => {
            const yr = parseInt(e.target.value);
            yearDisplay.innerText = yr;
            let z = 2.5;
            for (let i = 1; i <= (yr - 1300); i++) z -= (0.003 * Math.pow(1.018, i));
            
            let t = `${yr}: ${z > 0 ? '+' : ''}${z.toFixed(2)}m NAP`;
            if (yr === 1530) { t += " (🚨 Felixvloed)"; reimerswaalStatus.style.color = '#ff4444'; }
            else if (yr === 1532) { t += " (🚨 Allerheiligen)"; reimerswaalStatus.style.color = '#ff4444'; }
            else if (z < 1.2) { t += " (⚠️ Onder HW)"; reimerswaalStatus.style.color = '#ff9900'; }
            else { reimerswaalStatus.style.color = '#4ade80'; }
            reimerswaalStatus.innerText = t;
        });

        // === 9. HOOFD RENDER LOOP MET MEE-DRAAIENDE HUD BOVENBALK ===
        function drawAllLayers() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            const cx = w / 2;
            const cy = h / 2;

            if (!isSerialConnected && !isMobileSensorActive) {
                actueleAzimut = (actueleAzimut + 0.03) % 360;
            }

            // --- LAAG 1: DYNAMISCH MEE-DRAAIENDE KOMPAS BOVENBALK ---
            if (layers.compass.chk.checked) {
                const cCtx = layers.compass.ctx;
                cCtx.clearRect(0, 0, w, h);

                // Dynamische Kompaslint Ribbon
                const ribbonY = 22;
                cCtx.fillStyle = 'rgba(15, 16, 22, 0.75)';
                cCtx.fillRect(0, 0, w, 40);
                cCtx.strokeStyle = 'rgba(255, 107, 74, 0.5)';
                cCtx.beginPath();
                cCtx.moveTo(0, 40); cCtx.lineTo(w, 40);
                cCtx.stroke();

                // Teken bewegende gradenverdeling
                const pxPerDeg = w / CAMERA_FOV;
                const minDeg = Math.floor(actueleAzimut - CAMERA_FOV / 2);
                const maxDeg = Math.ceil(actueleAzimut + CAMERA_FOV / 2);

                for (let d = minDeg; d <= maxDeg; d++) {
                    let normD = (d + 3600) % 360;
                    let x = cx + ((d - actueleAzimut) * pxPerDeg);

                    if (normD % 15 === 0) {
                        cCtx.beginPath();
                        cCtx.moveTo(x, 22); cCtx.lineTo(x, 38);
                        cCtx.strokeStyle = '#fff';
                        cCtx.lineWidth = 1.5;
                        cCtx.stroke();

                        let label = `${normD}°`;
                        if (normD === 0) label = "N";
                        else if (normD === 90) label = "O";
                        else if (normD === 180) label = "Z";
                        else if (normD === 270) label = "W";

                        cCtx.fillStyle = (normD % 90 === 0) ? 'var(--accent-orange)' : '#ccc';
                        cCtx.font = 'bold 9px "Courier New"';
                        cCtx.textAlign = 'center';
                        cCtx.fillText(label, x, 16);
                    } else if (normD % 5 === 0) {
                        cCtx.beginPath();
                        cCtx.moveTo(x, 28); cCtx.lineTo(x, 38);
                        cCtx.strokeStyle = 'rgba(255,255,255,0.4)';
                        cCtx.lineWidth = 1;
                        cCtx.stroke();
                    }
                }

                // Centrale vizier-driehoek op actuele sensor-azimut
                cCtx.beginPath();
                cCtx.moveTo(cx - 6, 40);
                cCtx.lineTo(cx + 6, 40);
                cCtx.lineTo(cx, 48);
                cCtx.closePath();
                cCtx.fillStyle = 'var(--accent-orange)';
                cCtx.fill();

                cCtx.fillStyle = '#fff';
                cCtx.font = 'bold 13px "Courier New"';
                cCtx.textAlign = 'center';
                cCtx.fillText(`${actueleAzimut.toFixed(1)}°`, cx, 62);
                cCtx.textAlign = 'left';
            }

            // --- LAAG 2: ARCHEO MATRIX DOELINDICATOR ---
            if (layers.matrix.chk.checked) {
                const mCtx = layers.matrix.ctx;
                mCtx.clearRect(0, 0, w, h);

                const targetAzimut = parseFloat(targetSelector.value);
                const targetName = targetSelector.options[targetSelector.selectedIndex].dataset.name;

                let deltaHoek = targetAzimut - actueleAzimut;
                if (deltaHoek > 180) deltaHoek -= 360;
                if (deltaHoek < -180) deltaHoek += 360;

                if (Math.abs(deltaHoek) <= CAMERA_FOV / 2) {
                    const pxPerDeg = w / CAMERA_FOV;
                    const xPos = cx + (deltaHoek * pxPerDeg);

                    mCtx.beginPath();
                    mCtx.moveTo(xPos, 40); mCtx.lineTo(xPos, h);
                    mCtx.strokeStyle = 'rgba(138, 43, 226, 0.85)';
                    mCtx.lineWidth = 2.5;
                    mCtx.setLineDash([12, 8]);
                    mCtx.stroke();

                    mCtx.beginPath();
                    mCtx.arc(xPos, cy, 26, 0, 2 * Math.PI);
                    mCtx.strokeStyle = 'var(--accent-orange)';
                    mCtx.setLineDash([]);
                    mCtx.stroke();

                    mCtx.beginPath();
                    mCtx.moveTo(xPos - 35, cy); mCtx.lineTo(xPos + 35, cy);
                    mCtx.moveTo(xPos, cy - 35); mCtx.lineTo(xPos, cy + 35);
                    mCtx.lineWidth = 1.5;
                    mCtx.stroke();

                    mCtx.fillStyle = 'rgba(30, 30, 36, 0.9)';
                    mCtx.fillRect(xPos + 30, cy - 25, 200, 50);
                    mCtx.strokeStyle = 'rgba(255, 107, 74, 0.6)';
                    mCtx.strokeRect(xPos + 30, cy - 25, 200, 50);
                    
                    mCtx.fillStyle = '#4ade80'; 
                    mCtx.font = 'bold 10px "Courier New"';
                    mCtx.fillText(`${targetName}`, xPos + 38, cy - 8);
                    mCtx.fillStyle = '#fff';
                    mCtx.fillText(`AZ: ${targetAzimut.toFixed(1)}° | Δ: ${Math.abs(deltaHoek).toFixed(1)}°`, xPos + 38, cy + 10);
                }
            }

            // --- LAAG 3: SCILAB 3D ROTATIE MATRIX ---
            if (layers.scilab.chk.checked) {
                const sCtx = layers.scilab.ctx;
                sCtx.clearRect(0, 0, w, h);

                sCtx.fillStyle = 'rgba(15, 16, 22, 0.85)';
                sCtx.fillRect(15, 75, 190, 80);
                sCtx.strokeStyle = 'var(--accent-purple)';
                sCtx.strokeRect(15, 75, 190, 80);

                sCtx.fillStyle = 'var(--accent-purple)';
                sCtx.font = 'bold 9px "Courier New"';
                sCtx.fillText(`SCILAB R_z(θ) MATRIX`, 22, 90);

                const rad = actueleAzimut * (Math.PI / 180);
                const r00 = Math.cos(rad).toFixed(2);
                const r01 = (-Math.sin(rad)).toFixed(2);
                const r10 = Math.sin(rad).toFixed(2);
                const r11 = Math.cos(rad).toFixed(2);

                sCtx.fillStyle = '#aaa';
                sCtx.font = '8.5px "Courier New"';
                sCtx.fillText(`[ ${r00}  ${r01}   0 ]`, 22, 106);
                sCtx.fillText(`[ ${r10}  ${r11}   0 ]`, 22, 118);
                sCtx.fillText(`[ 0.00  0.00   1 ]`, 22, 130);
                sCtx.fillStyle = 'var(--accent-green)';
                sCtx.fillText(`det=1.00 | FOV=${CAMERA_FOV}°`, 22, 146);
            }

            // --- LAAG 4: TACHEOMETRIE / STADIA KRUIS ---
            if (layers.survey.chk.checked) {
                const svCtx = layers.survey.ctx;
                svCtx.clearRect(0, 0, w, h);

                svCtx.strokeStyle = 'rgba(0, 245, 212, 0.6)';
                svCtx.lineWidth = 1.2;

                svCtx.beginPath();
                svCtx.moveTo(cx - 40, cy); svCtx.lineTo(cx + 40, cy);
                svCtx.moveTo(cx, cy - 40); svCtx.lineTo(cx, cy + 40);
                svCtx.stroke();

                svCtx.beginPath();
                svCtx.moveTo(cx - 15, cy - 20); svCtx.lineTo(cx + 15, cy - 20);
                svCtx.moveTo(cx - 15, cy + 20); svCtx.lineTo(cx + 15, cy + 20);
                svCtx.stroke();

                svCtx.beginPath();
                svCtx.arc(cx, cy, 80, 0, 2 * Math.PI);
                svCtx.strokeStyle = 'rgba(0, 245, 212, 0.2)';
                svCtx.stroke();
            }

            // --- LAAG 5: ZEEMETING & HYDROGRAFIE ---
            if (layers.hydro.chk.checked) {
                const hCtx = layers.hydro.ctx;
                hCtx.clearRect(0, 0, w, h);

                const waterY = h - 28;
                hCtx.fillStyle = 'rgba(0, 187, 249, 0.2)';
                hCtx.fillRect(0, waterY, w, 28);
                hCtx.strokeStyle = 'var(--accent-blue)';
                hCtx.lineWidth = 1.5;
                hCtx.beginPath();
                hCtx.moveTo(0, waterY); hCtx.lineTo(w, waterY);
                hCtx.stroke();

                hCtx.fillStyle = 'var(--accent-blue)';
                hCtx.font = 'bold 9px "Courier New"';
                hCtx.fillText(`🌊 HYDROGRAFIE: LAT NIVEAU ACTIEF`, 15, waterY + 18);
            }

            // --- LAAG 6: GNOMON SCHADUWPROJECTIE ---
            if (layers.shadow.chk.checked) {
                const shCtx = layers.shadow.ctx;
                shCtx.clearRect(0, 0, w, h);

                const shadowAzimut = (180.0 + 45.0) % 360;
                let deltaShadow = shadowAzimut - actueleAzimut;
                if (deltaShadow > 180) deltaShadow -= 360;
                if (deltaShadow < -180) deltaShadow += 360;

                if (Math.abs(deltaShadow) <= CAMERA_FOV / 2) {
                    const xShadow = cx + (deltaShadow * (w / CAMERA_FOV));

                    shCtx.beginPath();
                    shCtx.moveTo(xShadow, cy);
                    shCtx.lineTo(xShadow - 30, h);
                    shCtx.lineTo(xShadow + 30, h);
                    shCtx.closePath();
                    shCtx.fillStyle = 'rgba(254, 228, 64, 0.15)';
                    shCtx.fill();

                    shCtx.beginPath();
                    shCtx.moveTo(xShadow, cy);
                    shCtx.lineTo(xShadow, h);
                    shCtx.strokeStyle = 'var(--accent-yellow)';
                    shCtx.lineWidth = 1.5;
                    shCtx.setLineDash([6, 5]);
                    shCtx.stroke();
                    shCtx.setLineDash([]);
                }
            }

            requestAnimationFrame(drawAllLayers);
        }

        drawAllLayers();
    </script>
</body>
</html>
