<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geodetische & Hydrografische HUD</title>
    <style>
        :root {
            --bg-dark: #1e1e24;
            --panel-bg: #2b2b36;
            --accent-orange: #ff6b4a;
            --accent-purple: #8a2be2;
            --accent-green: #4ade80;
            --accent-cyan: #00f5d4;
            --accent-blue: #00bbf9;
            --accent-yellow: #fee440;
            --text-light: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #sidebar {
            width: 210px;
            min-width: 190px;
            background-color: var(--panel-bg);
            border-right: 1px solid #3d3d4a;
            padding: 6px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            overflow-y: auto;
        }

        h2 { margin: 0 0 2px 0; font-size: 10px; letter-spacing: 0.5px; color: var(--accent-orange); }
        
        .control-group {
            background: #1e1e24;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #3d3d4a;
        }

        .control-group label {
            display: block;
            font-size: 8.5px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #aaa;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 3px;
        }

        .zoom-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            margin-bottom: 4px;
        }

        button {
            width: 100%;
            padding: 4px 5px;
            margin-bottom: 3px;
            background-color: #315273;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 9px;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button:hover { background-color: #3a638c; }
        button.active { background-color: #2e8b57; }
        button.danger { background-color: #b91c1c; }
        button.danger:hover { background-color: #dc2626; }

        select, input[type="range"] {
            width: 100%;
            padding: 3px;
            background: #2b2b36;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            margin-bottom: 4px;
            box-sizing: border-box;
            font-size: 9px;
        }

        optgroup {
            background: #1e1e24;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .data-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5px;
            color: var(--accent-green);
            background: #000;
            padding: 4px;
            border-radius: 3px;
            min-height: 20px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.25;
        }

        #viewport {
            flex-grow: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
        }

        #feed-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }

        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
            z-index: 2;
        }

        /* === VOLLEDIGE SPECTRALE & SENSOR FILTERSET === */
        .filter-none        { filter: contrast(110%) brightness(102%); }
        .filter-sun-solar  { filter: brightness(40%) contrast(400%) sepia(100%) hue-rotate(5deg) saturate(300%); }
        .filter-sun-halpha { filter: brightness(35%) contrast(500%) sepia(100%) hue-rotate(330deg) saturate(600%) blur(0.5px); }
        .filter-sun-nd     { filter: brightness(20%) contrast(500%) sepia(100%) hue-rotate(-20deg) saturate(400%); } 
        
        .filter-moon-lumi  { filter: contrast(170%) brightness(125%) hue-rotate(180deg) saturate(35%); }
        .filter-moon-lpr   { filter: contrast(200%) brightness(110%) hue-rotate(200deg) saturate(180%) invert(5%); }
        .filter-moon-ir    { filter: grayscale(100%) brightness(140%) contrast(220%); }
        
        .filter-astro-stars { filter: contrast(450%) brightness(160%) saturate(70%); }
        .filter-astro-sat   { filter: grayscale(100%) contrast(600%) brightness(180%); }
        .filter-astro-nebula { filter: contrast(350%) brightness(140%) saturate(400%) hue-rotate(290deg); }

        .filter-night-gen3 { filter: brightness(145%) contrast(200%) sepia(100%) hue-rotate(80deg) saturate(450%); }
        .filter-flir-iron  { filter: contrast(260%) brightness(95%) saturate(400%) hue-rotate(260deg) invert(20%); }
        .filter-flir-white { filter: grayscale(100%) invert(100%) contrast(280%) brightness(115%); }
        .filter-mono-edge  { filter: grayscale(100%) contrast(400%) brightness(90%); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 26vh; }
            #viewport { height: 74vh; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>SURVEY HUD</h2>
        
        <div class="control-group">
            <label>1. Live Streams & Viewport</label>
            <div class="btn-grid">
                <button id="btn-toggle-camera">Camera</button>
                <button id="btn-toggle-screen">Scherm</button>
            </div>
            <div class="btn-grid">
                <button id="btn-toggle-fullscreen">Full</button>
                <button id="btn-toggle-pip">PiP</button>
            </div>
        </div>

        <div class="control-group">
            <label>2. Sensoren (Azimut)</label>
            <button id="btn-enable-sensor">📱 Activeer Kompas</button>
            <select id="baud-rate">
                <option value="4800">4800 Baud</option>
                <option value="9600">9600 Baud</option>
                <option value="38400">38400 Baud</option>
                <option value="115200">115200 Baud</option>
            </select>
            <button id="btn-connect-serial">Serial API</button>
            <div class="data-display" id="serial-output">Sensor: Stand-by</div>
        </div>

        <div class="control-group">
            <label>3. Spectraalfilters & Zoom</label>
            <select id="filter-selector">
                <option value="filter-none">Standaard (Scherpte Boost)</option>
                
                <optgroup label="✨ Sterren & Satellieten">
                    <option value="filter-astro-stars">✨ Sterrenveld (High Gain)</option>
                    <option value="filter-astro-sat">🛰️ Satelliet Tracker (Mono, Max Contrast)</option>
                    <option value="filter-astro-nebula">🌌 Deep Sky (Nevel/Kleur Boost)</option>
                </optgroup>

                <optgroup label="☀️ Zon- & Eclipsfilters">
                    <option value="filter-sun-nd">🌑 Eclips ND-Filter (Zwaar)</option>
                    <option value="filter-sun-solar">☀️ Zonnefolie (Oranje)</option>
                    <option value="filter-sun-halpha">🔴 H-Alpha 656nm (Rood)</option>
                </optgroup>

                <optgroup label="🌙 Maan- & Astrometriefilters">
                    <option value="filter-moon-lumi">🌙 Maanfilter</option>
                    <option value="filter-moon-lpr">🌌 LPR-Filter</option>
                    <option value="filter-moon-ir">📡 Infrarood Pass</option>
                </optgroup>

                <optgroup label="🟢 Nachtzicht & Sensorfilters">
                    <option value="filter-night-gen3">🟢 Nachtzicht Gen-3</option>
                    <option value="filter-flir-iron">🔥 FLIR Thermisch</option>
                    <option value="filter-flir-white">⚪ White-Hot Thermisch</option>
                    <option value="filter-mono-edge">📐 Monochroom Contour</option>
                </optgroup>
            </select>
            
            <div style="display:flex; justify-content:space-between; font-size:8px; color:#aaa; margin-top:4px;">
                <span>Zoom Presets (tot 100x):</span>
            </div>
            
            <div class="zoom-grid">
                <button class="zoom-btn" data-zoom="1">1x</button>
                <button class="zoom-btn" data-zoom="10">10x</button>
                <button class="zoom-btn" data-zoom="25">25x</button>
                <button class="zoom-btn" data-zoom="50">50x</button>
                <button class="zoom-btn" data-zoom="100">100x</button>
            </div>

            <div style="display:flex; justify-content:space-between; font-size:8px; color:#aaa;">
                <span>Actuele Zoom:</span><span id="zoom-val" style="color:var(--accent-orange); font-weight:bold;">1x</span>
            </div>
            <input type="range" id="zoom-slider" min="1" max="100" step="0.5" value="1">
            
            <div class="checkbox-container" style="display:flex; align-items:center; gap:4px; margin-top:2px;">
                <input type="checkbox" id="chk-auto-sharpness" checked style="width:auto; margin:0;">
                <label for="chk-auto-sharpness" style="font-size:8px; color:#ddd; margin:0;">Adaptieve Anti-Blur (Pixelation)</label>
            </div>
        </div>

        <div class="control-group">
            <label>4. Opname</label>
            <div class="btn-grid">
                <button id="btn-take-photo">📸 Foto</button>
                <button id="btn-record-video">🎥 Record</button>
            </div>
            <div class="data-display" id="capture-status">Stand-by</div>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div id="viewport">
        <div id="feed-wrapper">
            <video id="video-feed" class="filter-none" autoplay playsinline muted></video>
            <canvas id="layer-hud" class="hud-layer"></canvas>
        </div>
    </div>

    <script>
        // === STATE ENGINE & CONFIGURATIE ===
        let actueleAzimut = 90.0; // Start exact op OOST (90°)
        let sensorOffset = 0.0;
        let isSerialConnected = false;
        let isMobileSensorActive = false;
        let hasAbsoluteSensor = false;

        let cameraStream = null;
        let screenStream = null;
        let videoTrack = null;
        let cameraCapabilities = null;

        const viewport = document.getElementById('viewport');
        const feedWrapper = document.getElementById('feed-wrapper');
        const video = document.getElementById('video-feed');
        const serialOutput = document.getElementById('serial-output');
        
        const filterSelector = document.getElementById('filter-selector');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');
        const zoomButtons = document.querySelectorAll('.zoom-btn');
        const chkAutoSharpness = document.getElementById('chk-auto-sharpness');
        const captureStatus = document.getElementById('capture-status');
        
        const btnToggleCamera = document.getElementById('btn-toggle-camera');
        const btnToggleScreen = document.getElementById('btn-toggle-screen');
        const btnEnableSensor = document.getElementById('btn-enable-sensor');

        const hudCanvas = document.getElementById('layer-hud');
        const hudCtx = hudCanvas.getContext('2d');

        function resizeAllLayers() {
            const dpr = window.devicePixelRatio || 1;
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;

            hudCanvas.width = w * dpr;
            hudCanvas.height = h * dpr;
            hudCanvas.style.width = `${w}px`;
            hudCanvas.style.height = `${h}px`;
            hudCtx.setTransform(1, 0, 0, 1, 0, 0);
            hudCtx.scale(dpr, dpr);
            hudCtx.imageSmoothingEnabled = true;
            hudCtx.imageSmoothingQuality = 'high';
        }
        window.addEventListener('resize', resizeAllLayers);
        resizeAllLayers();

        // === CAMERA ===
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
                videoTrack = null;
                cameraCapabilities = null;
            }
            if (video.srcObject && !screenStream) video.srcObject = null;
            btnToggleCamera.classList.remove('danger');
            btnToggleCamera.innerText = 'Camera';
        }

        btnToggleCamera.addEventListener('click', async () => {
            if (cameraStream) stopCamera();
            else {
                try {
                    if (screenStream) stopScreenShare();
                    cameraStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: "environment", 
                            width: { ideal: 3840, min: 1920 }, 
                            height: { ideal: 2160, min: 1080 }
                        } 
                    });
                    video.srcObject = cameraStream;
                    videoTrack = cameraStream.getVideoTracks()[0];
                    if (videoTrack.getCapabilities) cameraCapabilities = videoTrack.getCapabilities();

                    btnToggleCamera.classList.add('danger');
                    btnToggleCamera.innerText = 'Stop Cam';
                    applySharpZoom();
                } catch (err) { alert("Camera fout: " + err.message); }
            }
        });

        // === QUATERNION KOMPAS SENSOR (GIMBAL-LOCK VRIJ) ===
        function handleOrientation(event) {
            let heading = null;
            
            if (event.absolute || event.type === 'deviceorientationabsolute') hasAbsoluteSensor = true;

            if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                heading = event.webkitCompassHeading;
                hasAbsoluteSensor = true;
            } 
            else if (event.alpha !== null && event.beta !== null && event.gamma !== null) {
                if (hasAbsoluteSensor || event.absolute === undefined) {
                    const degToRad = Math.PI / 180;

                    const alpha = event.alpha * degToRad;
                    const beta = event.beta * degToRad;
                    const gamma = event.gamma * degToRad;

                    const c1 = Math.cos(beta / 2);
                    const c2 = Math.cos(gamma / 2);
                    const c3 = Math.cos(alpha / 2);
                    const s1 = Math.sin(beta / 2);
                    const s2 = Math.sin(gamma / 2);
                    const s3 = Math.sin(alpha / 2);

                    const x = s1 * c2 * c3 - c1 * s2 * s3;
                    const y = c1 * s2 * c3 + s1 * c2 * s3;
                    const z = c1 * c2 * s3 + s1 * s2 * c3;
                    const w = c1 * c2 * c3 - s1 * s2 * s3;

                    let vx = -2 * (x * z + w * y);
                    let vy = -2 * (y * z - w * x);
                    
                    let tx = 2 * (x * y - w * z);
                    let ty = 1 - 2 * x * x - 2 * z * z;

                    const cameraLenSq = vx * vx + vy * vy;
                    if (cameraLenSq < 0.2) {
                        heading = Math.atan2(tx, ty);
                    } else {
                        heading = Math.atan2(vx, vy);
                    }

                    heading = heading * (180 / Math.PI);
                }
            }

            if (heading !== null && !isNaN(heading)) {
                const screenAngle = (window.screen && window.screen.orientation) ? window.screen.orientation.angle : (window.orientation || 0);
                heading = heading + screenAngle;
                heading = (heading + 360) % 360;

                actueleAzimut = (heading + sensorOffset) % 360;
                isMobileSensorActive = true;
                
                let lockStatus = hasAbsoluteSensor || event.webkitCompassHeading !== undefined ? "(Q-Lock GPS)" : "(Q-Lock Relatief)";
                serialOutput.innerText = `Kompas: ${actueleAzimut.toFixed(1)}° ${lockStatus}`;
            }
        }

        async function initSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        btnEnableSensor.classList.add('active');
                        btnEnableSensor.innerText = '📱 Kompas Actief';
                    }
                } catch (e) { console.error(e); }
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
                btnEnableSensor.classList.add('active');
                btnEnableSensor.innerText = '📱 Kompas Actief';
            }
        }

        btnEnableSensor.addEventListener('click', async () => {
            sensorOffset = 0.0;
            await initSensor();
        });


        // === ZOOM ===
        function applySharpZoom() {
            const z = parseFloat(zoomSlider.value);
            zoomVal.innerText = z.toFixed(1) + 'x';

            if (videoTrack && cameraCapabilities && cameraCapabilities.zoom) {
                const hwMin = cameraCapabilities.zoom.min;
                const hwMax = cameraCapabilities.zoom.max;
                const targetHwZoom = Math.min(hwMax, Math.max(hwMin, z));
                videoTrack.applyConstraints({ advanced: [{ zoom: targetHwZoom }] }).catch(() => {});
            }

            feedWrapper.style.transform = `scale(${z})`;
            video.className = filterSelector.value;

            if (chkAutoSharpness.checked && z > 1.5) {
                video.style.imageRendering = z > 8 ? 'pixelated' : 'crisp-edges';
            } else {
                video.style.imageRendering = 'crisp-edges';
            }
        }

        zoomButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                zoomSlider.value = e.target.getAttribute('data-zoom');
                applySharpZoom();
            });
        });

        zoomSlider.addEventListener('input', applySharpZoom);
        chkAutoSharpness.addEventListener('change', applySharpZoom);
        filterSelector.addEventListener('change', applySharpZoom);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            let currentZoom = parseFloat(zoomSlider.value);
            const zoomStep = 1.5; 
            if (e.deltaY < 0) currentZoom += zoomStep;
            else currentZoom -= zoomStep;
            
            currentZoom = Math.max(1, Math.min(100, currentZoom));
            zoomSlider.value = currentZoom.toFixed(1);
            applySharpZoom();
        }, { passive: false });

        let initialPinchDistance = null;
        let initialZoomValue = 1;

        function getPinchDistance(e) {
            return Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialPinchDistance = getPinchDistance(e);
                initialZoomValue = parseFloat(zoomSlider.value);
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance !== null) {
                e.preventDefault();
                const currentDistance = getPinchDistance(e);
                const scale = currentDistance / initialPinchDistance;
                let newZoom = initialZoomValue * scale;
                newZoom = Math.max(1, Math.min(100, newZoom));
                zoomSlider.value = newZoom.toFixed(1);
                applySharpZoom();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDistance = null;
        });

        // === HOOFD RENDER LOOP ===
        function drawAllLayers() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            const cx = w / 2;
            const cy = h / 2;

            if (!isSerialConnected && !isMobileSensorActive) {
                // Rotatie van Oost naar West via Zuid naar Noord
                actueleAzimut = (actueleAzimut + 0.15) % 360; 
            }

            hudCtx.clearRect(0, 0, w, h);

            // TAPE KOMPAS BOVENAAN
            hudCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            hudCtx.fillRect(0, 0, w, 40);

            const fov = 75; 
            hudCtx.textAlign = 'center';
            hudCtx.font = 'bold 12px "Courier New"';

            for (let i = -fov; i <= fov; i++) {
                let markAngle = (actueleAzimut + i + 360) % 360;
                
                if (Math.round(markAngle) % 15 === 0) {
                    let xPos = cx + (i * (w / (fov * 2))); 
                    
                    let label = "";
                    if (Math.round(markAngle) === 0 || Math.round(markAngle) === 360) label = "N";
                    else if (Math.round(markAngle) === 90) label = "O";
                    else if (Math.round(markAngle) === 180) label = "Z";
                    else if (Math.round(markAngle) === 270) label = "W";
                    else label = Math.round(markAngle).toString();

                    hudCtx.fillStyle = (label.length === 1) ? 'var(--accent-orange)' : 'var(--accent-cyan)';
                    hudCtx.fillText(label, xPos, 25);
                    
                    hudCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    hudCtx.beginPath();
                    hudCtx.moveTo(xPos, 30);
                    hudCtx.lineTo(xPos, 40);
                    hudCtx.stroke();
                }
            }

            hudCtx.fillStyle = 'var(--accent-orange)';
            hudCtx.beginPath();
            hudCtx.moveTo(cx, 40);
            hudCtx.lineTo(cx - 5, 33);
            hudCtx.lineTo(cx + 5, 33);
            hudCtx.fill();

            if (filterSelector.value.includes('sun')) {
                hudCtx.fillStyle = 'rgba(255, 0, 0, 0.8)';
                hudCtx.fillRect(cx - 150, h - 60, 300, 30);
                hudCtx.fillStyle = '#fff';
                hudCtx.font = 'bold 12px "Segoe UI", sans-serif';
                hudCtx.textAlign = 'center';
                hudCtx.fillText("⚠️ WAARSCHUWING: FYSIEK LENSFILTER VEREIST", cx, h - 40);
            }

            hudCtx.strokeStyle = 'rgba(0, 245, 212, 0.6)';
            hudCtx.lineWidth = 1;
            hudCtx.beginPath();
            hudCtx.moveTo(cx - 15, cy);
            hudCtx.lineTo(cx + 15, cy);
            hudCtx.moveTo(cx, cy - 15);
            hudCtx.lineTo(cx, cy + 15);
            hudCtx.stroke();

            hudCtx.fillStyle = 'var(--accent-cyan)';
            hudCtx.textAlign = 'left';
            hudCtx.font = 'bold 12px "Courier New"';
            hudCtx.fillText(`AZ: ${actueleAzimut.toFixed(1)}°`, cx + 20, cy + 5);

            requestAnimationFrame(drawAllLayers);
        }

        drawAllLayers();
    </script>
</body>
</html>
