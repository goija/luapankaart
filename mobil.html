<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geodetische LiDAR & Hydrografische Metingen HUD</title>
    <style>
        :root {
            --bg-dark: #1e1e24;
            --panel-bg: #2b2b36;
            --accent-orange: #ff6b4a;
            --accent-purple: #8a2be2;
            --accent-green: #4ade80;
            --accent-cyan: #00f5d4;
            --accent-blue: #00bbf9;
            --accent-yellow: #fee440;
            --text-light: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 210px;
            min-width: 190px;
            background-color: var(--panel-bg);
            border-right: 1px solid #3d3d4a;
            padding: 6px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            overflow-y: auto;
        }

        h2 { margin: 0 0 2px 0; font-size: 10px; letter-spacing: 0.5px; color: var(--accent-orange); }
        
        .control-group {
            background: #1e1e24;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #3d3d4a;
        }

        .control-group label {
            display: block;
            font-size: 8.5px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #aaa;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 3px;
        }

        button {
            width: 100%;
            padding: 4px 5px;
            margin-bottom: 3px;
            background-color: #315273;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 9px;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button:hover { background-color: #3a638c; }
        button.active { background-color: #2e8b57; }
        button.danger { background-color: #b91c1c; }
        button.danger:hover { background-color: #dc2626; }

        select, input[type="range"], input[type="number"] {
            width: 100%;
            padding: 3px;
            background: #2b2b36;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            margin-bottom: 4px;
            box-sizing: border-box;
            font-size: 9px;
        }

        optgroup {
            background: #1e1e24;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .data-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5px;
            color: var(--accent-green);
            background: #000;
            padding: 4px;
            border-radius: 3px;
            min-height: 20px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.25;
        }

        #viewport {
            flex-grow: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #feed-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }

        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
            z-index: 2;
        }

        /* === VOLLEDIGE SPECTRALE & SENSOR FILTERSET === */
        .filter-none        { filter: contrast(110%) brightness(102%); }
        
        /* Zonne- & Eclipsfilters */
        .filter-sun-solar  { filter: contrast(240%) brightness(85%) sepia(85%) hue-rotate(-20deg) saturate(320%); }
        .filter-sun-halpha { filter: contrast(300%) brightness(70%) saturate(600%) hue-rotate(330deg) drop-shadow(0 0 4px #ff0033); }
        .filter-sun-nd     { filter: brightness(35%) contrast(350%) grayscale(40%) sepia(30%); }

        /* Maan- & Nachtfilters */
        .filter-moon-lumi  { filter: contrast(170%) brightness(125%) hue-rotate(180deg) saturate(35%); }
        .filter-moon-lpr   { filter: contrast(200%) brightness(110%) hue-rotate(200deg) saturate(180%) invert(5%); }
        .filter-moon-ir    { filter: grayscale(100%) brightness(140%) contrast(220%); }

        /* Sensor- & Militair / Meetfilters */
        .filter-night-gen3 { filter: brightness(145%) contrast(200%) sepia(100%) hue-rotate(80deg) saturate(450%); }
        .filter-flir-iron  { filter: contrast(260%) brightness(95%) saturate(400%) hue-rotate(260deg) invert(20%); }
        .filter-flir-white { filter: grayscale(100%) invert(100%) contrast(280%) brightness(115%); }
        .filter-mono-edge  { filter: grayscale(100%) contrast(400%) brightness(90%); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 26vh; }
            #viewport { height: 74vh; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>SURVEY & LIDAR HUD</h2>
        
        <!-- 1. LIVEFEED STREAMS -->
        <div class="control-group">
            <label>1. Live Streams & Viewport</label>
            <div class="btn-grid">
                <button id="btn-toggle-camera">Camera</button>
                <button id="btn-toggle-screen">Scherm</button>
            </div>
            <div class="btn-grid">
                <button id="btn-toggle-fullscreen">Full</button>
                <button id="btn-toggle-pip">PiP</button>
            </div>
        </div>

        <!-- 2. SENSOREN -->
        <div class="control-group">
            <label>2. Sensoren (Azimut)</label>
            <button id="btn-enable-sensor">📱 Activeer Sensor</button>
            <select id="baud-rate">
                <option value="4800">4800 Baud</option>
                <option value="9600">9600 Baud</option>
                <option value="38400">38400 Baud</option>
                <option value="115200">115200 Baud</option>
            </select>
            <button id="btn-connect-serial">Serial API</button>
            <div class="data-display" id="serial-output">Sensor: Stand-by</div>
        </div>

        <!-- 3. LIDAR SCANS & HISTORISCHE MATEN -->
        <div class="control-group">
            <label>3. LiDAR Engine & Historische Maten</label>
            <button id="btn-toggle-lidar-state" class="active">⚡ LiDAR: AAN</button>
            <select id="geo-unit-selector">
                <optgroup label="🌊 Historische Zeemijlen / Maritiem">
                    <option value="holland_zeemijl">Hollandse Zeemijl (5555.55 m)</option>
                    <option value="spaans_legua">Spaanse Legua Maritima (5572 m)</option>
                    <option value="engels_league">English Marine League (5556 m)</option>
                    <option value="amsterdam_vadem">Amsterdamse Vadem (1.698 m)</option>
                    <option value="engels_fathom">Engelse Fathom (1.8288 m)</option>
                    <option value="kabellengte">Kabellengte (225.0 m)</option>
                </optgroup>
                <optgroup label="📐 Historische Landmaten">
                    <option value="rijnland_roede">Rijnlandse Roede (3.767 m)</option>
                    <option value="rijnland_voet">Rijnlandse Voet (0.314 m)</option>
                    <option value="amsterdam_roede">Amsterdamse Roede (3.680 m)</option>
                    <option value="amsterdam_voet">Amsterdamse Voet (0.283 m)</option>
                    <option value="gunter_chain">Gunter's Chain / Ketting (20.1168 m)</option>
                </optgroup>
            </select>
            
            <div style="display:flex; justify-content:space-between; font-size:8px; color:#aaa;">
                <span>LiDAR Bereik:</span><span id="lidar-range-val" style="color:var(--accent-cyan); font-weight:bold;">120m</span>
            </div>
            <input type="range" id="lidar-range-slider" min="10" max="5000" step="10" value="120">
            <div class="data-display" id="lidar-metrics">LiDAR Status: Actief&#10;Afstand: 120.0 m | 31.86 RR</div>
        </div>

        <!-- 4. VOLLEDIG SPECTRUM FILTERS & ZOOM (START 10X) -->
        <div class="control-group">
            <label>4. Spectraalfilters & Sharp-Zoom</label>
            <select id="filter-selector">
                <option value="filter-none">Standaard (Scherpte Boost)</option>
                
                <optgroup label="☀️ Zon- & Eclipsfilters">
                    <option value="filter-sun-solar">☀️ Zonnefilter (High-Contrast)</option>
                    <option value="filter-sun-halpha">🔴 H-Alpha 656nm (Zonnevlammen)</option>
                    <option value="filter-sun-nd">🌑 Eclips ND-Filter (Zonneverduistering)</option>
                </optgroup>

                <optgroup label="🌙 Maan- & Astrometriefilters">
                    <option value="filter-moon-lumi">🌙 Maanfilter (Luminantie / Zilver)</option>
                    <option value="filter-moon-lpr">🌌 LPR-Filter (Lichtvervuiling Block)</option>
                    <option value="filter-moon-ir">📡 Infrarood Pass (850nm Astrometrie)</option>
                </optgroup>

                <optgroup label="🟢 Nachtzicht & Sensorfilters">
                    <option value="filter-night-gen3">🟢 Nachtzicht Gen-3 (IR Fosfor)</option>
                    <option value="filter-flir-iron">🔥 FLIR Thermisch (Ironbow)</option>
                    <option value="filter-flir-white">⚪ White-Hot Thermisch Contrast</option>
                    <option value="filter-mono-edge">📐 Monochroom LiDAR Contour Edge</option>
                </optgroup>
            </select>
            
            <div style="display:flex; justify-content:space-between; font-size:8px; color:#aaa;">
                <span>Zoom:</span><span id="zoom-val" style="color:var(--accent-orange); font-weight:bold;">10x (Sharp)</span>
            </div>
            <input type="range" id="zoom-slider" min="1" max="1500" step="0.5" value="10">
            <div class="checkbox-container" style="display:flex; align-items:center; gap:4px; margin-top:2px;">
                <input type="checkbox" id="chk-auto-sharpness" checked style="width:auto; margin:0;">
                <label for="chk-auto-sharpness" style="font-size:8px; color:#ddd; margin:0;">Adaptieve Anti-Blur & Unsharp Mask</label>
            </div>
        </div>

        <!-- 5. CAPTURE & RECORDING -->
        <div class="control-group">
            <label>5. Opname</label>
            <div class="btn-grid">
                <button id="btn-take-photo">📸 Foto</button>
                <button id="btn-record-video">🎥 Record</button>
            </div>
            <div class="data-display" id="capture-status">Stand-by</div>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div id="viewport">
        <div id="feed-wrapper">
            <video id="video-feed" class="filter-none" autoplay playsinline muted></video>
            
            <canvas id="layer-lidar" class="hud-layer"></canvas>
        </div>
    </div>

    <script>
        // === STATE ENGINE & CONFIGURATIE ===
        let actueleAzimut = 0.0;
        let sensorOffset = 0.0;
        let lastRawHeading = 0.0;
        let isSerialConnected = false;
        let isMobileSensorActive = false;
        let isLidarActive = true;
        const CAMERA_FOV = 60;

        let cameraStream = null;
        let screenStream = null;
        let videoTrack = null;
        let cameraCapabilities = null;

        const viewport = document.getElementById('viewport');
        const feedWrapper = document.getElementById('feed-wrapper');
        const video = document.getElementById('video-feed');
        const serialOutput = document.getElementById('serial-output');
        const geoUnitSelector = document.getElementById('geo-unit-selector');
        const lidarRangeSlider = document.getElementById('lidar-range-slider');
        const lidarRangeVal = document.getElementById('lidar-range-val');
        const lidarMetrics = document.getElementById('lidar-metrics');
        const filterSelector = document.getElementById('filter-selector');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');
        const chkAutoSharpness = document.getElementById('chk-auto-sharpness');
        const captureStatus = document.getElementById('capture-status');
        const btnToggleCamera = document.getElementById('btn-toggle-camera');
        const btnToggleScreen = document.getElementById('btn-toggle-screen');
        const btnEnableSensor = document.getElementById('btn-enable-sensor');
        const btnToggleLidarState = document.getElementById('btn-toggle-lidar-state');

        const lidarCanvas = document.getElementById('layer-lidar');
        const lidarCtx = lidarCanvas.getContext('2d');

        const HISTORICAL_UNITS = {
            holland_zeemijl: { factor: 5555.55, name: "Holl. Zeemijl", code: "HZM" },
            spaans_legua:    { factor: 5572.00, name: "Legua Maritima", code: "LEG" },
            engels_league:   { factor: 5556.00, name: "Marine League", code: "LEA" },
            amsterdam_vadem: { factor: 1.698,   name: "Amst. Vadem", code: "AV" },
            engels_fathom:   { factor: 1.8288,  name: "Fathom", code: "FTH" },
            kabellengte:     { factor: 225.0,   name: "Kabellengte", code: "CBL" },
            rijnland_roede:  { factor: 3.767,   name: "Rijnl. Roede", code: "RR" },
            rijnland_voet:   { factor: 0.314,   name: "Rijnl. Voet", code: "RV" },
            amsterdam_roede: { factor: 3.680,   name: "Amst. Roede", code: "AR" },
            amsterdam_voet:  { factor: 0.283,   name: "Amst. Voet", code: "AVt" },
            gunter_chain:    { factor: 20.1168, name: "Gunter Ketting", code: "CHN" }
        };

        function resizeAllLayers() {
            const dpr = window.devicePixelRatio || 1;
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;

            lidarCanvas.width = w * dpr;
            lidarCanvas.height = h * dpr;
            lidarCanvas.style.width = `${w}px`;
            lidarCanvas.style.height = `${h}px`;
            lidarCtx.setTransform(1, 0, 0, 1, 0, 0);
            lidarCtx.scale(dpr, dpr);
            lidarCtx.imageSmoothingEnabled = true;
            lidarCtx.imageSmoothingQuality = 'high';
        }
        window.addEventListener('resize', resizeAllLayers);
        resizeAllLayers();

        // === 1. LIVEFEED STREAMS ===
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
                videoTrack = null;
                cameraCapabilities = null;
            }
            if (video.srcObject && !screenStream) video.srcObject = null;
            btnToggleCamera.classList.remove('danger');
            btnToggleCamera.innerText = 'Camera';
        }

        btnToggleCamera.addEventListener('click', async () => {
            if (cameraStream) {
                stopCamera();
            } else {
                try {
                    if (screenStream) stopScreenShare();
                    cameraStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: "environment", 
                            width: { ideal: 3840, min: 1920 }, 
                            height: { ideal: 2160, min: 1080 }
                        } 
                    });
                    video.srcObject = cameraStream;
                    videoTrack = cameraStream.getVideoTracks()[0];
                    if (videoTrack.getCapabilities) cameraCapabilities = videoTrack.getCapabilities();

                    btnToggleCamera.classList.add('danger');
                    btnToggleCamera.innerText = 'Stop Cam';
                    applySharpZoom();
                } catch (err) { alert("Camera fout: " + err.message); }
            }
        });

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            if (video.srcObject && !cameraStream) video.srcObject = null;
            btnToggleScreen.classList.remove('danger');
            btnToggleScreen.innerText = 'Scherm';
        }

        btnToggleScreen.addEventListener('click', async () => {
            if (screenStream) {
                stopScreenShare();
            } else {
                try {
                    if (cameraStream) stopCamera();
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60 }, audio: false });
                    video.srcObject = screenStream;
                    btnToggleScreen.classList.add('danger');
                    btnToggleScreen.innerText = 'Stop Deel';
                    screenStream.getVideoTracks()[0].onended = stopScreenShare;
                } catch (err) { console.error(err); }
            }
        });

        // === 2. DYNAMISCHE 3D ORIËNTATIE ===
        function computeTrueHeading(e) {
            if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
                return e.webkitCompassHeading;
            }
            if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
                const degToRad = Math.PI / 180;
                const alpha = e.alpha * degToRad;
                const beta = e.beta * degToRad;
                const gamma = e.gamma * degToRad;

                const cA = Math.cos(alpha), sA = Math.sin(alpha);
                const cB = Math.cos(beta),  sB = Math.sin(beta);
                const cG = Math.cos(gamma), sG = Math.sin(gamma);

                const rA = -cA * sG - sA * sB * cG;
                const rB = -sA * sG + cA * sB * cG;

                let compassHeading = Math.atan2(rA, rB) * (180 / Math.PI);
                if (compassHeading < 0) compassHeading += 360;

                const screenAngle = (window.screen && window.screen.orientation) ? window.screen.orientation.angle : (window.orientation || 0);
                compassHeading = (compassHeading + screenAngle) % 360;

                return compassHeading;
            }
            return null;
        }

        function handleOrientation(event) {
            const heading = computeTrueHeading(event);
            if (heading !== null && !isNaN(heading)) {
                lastRawHeading = heading;
                actueleAzimut = (lastRawHeading + sensorOffset + 360) % 360;
                isMobileSensorActive = true;
                serialOutput.innerText = `[Live Sensor] Azimut: ${actueleAzimut.toFixed(1)}°`;
            }
        }

        async function initSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        btnEnableSensor.classList.add('active');
                        btnEnableSensor.innerText = '📱 Sensor Actief';
                        return true;
                    }
                } catch (e) { console.error(e); }
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
                btnEnableSensor.classList.add('active');
                btnEnableSensor.innerText = '📱 Sensor Actief';
                return true;
            }
            return false;
        }

        btnEnableSensor.addEventListener('click', async () => {
            sensorOffset = 0.0;
            await initSensor();
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        document.getElementById('btn-connect-serial').addEventListener('click', async (e) => {
            if (!("serial" in navigator)) return alert("Web Serial vereist Chrome/Edge.");
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: parseInt(document.getElementById('baud-rate').value) });
                isSerialConnected = true;
                e.target.classList.add('active');
                const decoder = new TextDecoderStream();
                port.readable.pipeTo(decoder.writable);
                const reader = decoder.readable.getReader();
                let buf = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += value;
                    const lines = buf.split('\n');
                    buf = lines.pop();
                    for (let l of lines) {
                        if (l.includes('HDT') || l.includes('RMC')) {
                            let p = l.split(',');
                            if (p[1] && !isNaN(parseFloat(p[1]))) {
                                lastRawHeading = parseFloat(p[1]);
                                actueleAzimut = (lastRawHeading + sensorOffset + 360) % 360;
                                serialOutput.innerText = `[NMEA Live] Azimut: ${actueleAzimut.toFixed(1)}°`;
                            }
                        }
                    }
                }
            } catch (err) { console.error(err); }
        });

        // === 3. BEGINSTAND 10X ZOOM & ADAPTIEVE SHARP ENGINE ===
        function applySharpZoom() {
            const z = parseFloat(zoomSlider.value);
            zoomVal.innerText = z === 1 ? '1.0x (Start)' : (z >= 10 ? z.toFixed(0) + 'x (Sharp)' : z.toFixed(1) + 'x (HD)');

            if (videoTrack && cameraCapabilities && cameraCapabilities.zoom) {
                const hwMin = cameraCapabilities.zoom.min;
                const hwMax = cameraCapabilities.zoom.max;
                const targetHwZoom = Math.min(hwMax, Math.max(hwMin, z));
                videoTrack.applyConstraints({ advanced: [{ zoom: targetHwZoom }] }).catch(() => {});
            }

            feedWrapper.style.transform = `scale(${z})`;

            const selectedFilterClass = filterSelector.value;
            video.className = selectedFilterClass;

            if (chkAutoSharpness.checked && z > 1.5) {
                video.style.imageRendering = z > 8 ? 'pixelated' : 'crisp-edges';
            } else {
                video.style.imageRendering = 'crisp-edges';
            }
        }

        // Direct naar 10x
        zoomSlider.value = 10;
        applySharpZoom();

        zoomSlider.addEventListener('input', applySharpZoom);
        chkAutoSharpness.addEventListener('change', applySharpZoom);
        filterSelector.addEventListener('change', applySharpZoom);

        // === 4. LIDAR AAN/UIT & METINGEN ===
        btnToggleLidarState.addEventListener('click', () => {
            isLidarActive = !isLidarActive;
            if (isLidarActive) {
                btnToggleLidarState.classList.remove('danger');
                btnToggleLidarState.classList.add('active');
                btnToggleLidarState.innerText = '⚡ LiDAR: AAN';
            } else {
                btnToggleLidarState.classList.remove('active');
                btnToggleLidarState.classList.add('danger');
                btnToggleLidarState.innerText = '⭕ LiDAR: UIT';
            }
            updateLidarMetrics();
        });

        function updateLidarMetrics() {
            const m = parseFloat(lidarRangeSlider.value);
            lidarRangeVal.innerText = m >= 1000 ? (m / 1000).toFixed(2) + 'km' : m.toFixed(0) + 'm';
            const unitKey = geoUnitSelector.value;
            const unit = HISTORICAL_UNITS[unitKey];
            const converted = (m / unit.factor).toFixed(3);

            if (isLidarActive) {
                lidarMetrics.innerText = `LiDAR: Actief (${m.toFixed(1)} m)\nMaat: ${converted} ${unit.name} (${unit.code})`;
            } else {
                lidarMetrics.innerText = `LiDAR: Stand-by / Uitgeschakeld\nReferentie: ${converted} ${unit.name}`;
            }
        }

        lidarRangeSlider.addEventListener('input', updateLidarMetrics);
        geoUnitSelector.addEventListener('change', updateLidarMetrics);
        updateLidarMetrics();

        // === 5. OPNAME & FOTO ===
        document.getElementById('btn-toggle-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) viewport.requestFullscreen().catch(e => alert(e.message));
            else document.exitFullscreen();
        });

        document.getElementById('btn-toggle-pip').addEventListener('click', async () => {
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else if (video.srcObject) await video.requestPictureInPicture();
            } catch (err) { console.error(err); }
        });

        function getMergedLayersCanvas() {
            const merged = document.createElement('canvas');
            merged.width = viewport.clientWidth * (window.devicePixelRatio || 1);
            merged.height = viewport.clientHeight * (window.devicePixelRatio || 1);
            const mCtx = merged.getContext('2d');
            mCtx.imageSmoothingEnabled = true;
            mCtx.imageSmoothingQuality = 'high';

            if (video.videoWidth > 0 && video.srcObject) {
                mCtx.filter = getComputedStyle(video).filter;
                mCtx.drawImage(video, 0, 0, merged.width, merged.height);
                mCtx.filter = 'none';
            }

            if (isLidarActive) mCtx.drawImage(lidarCanvas, 0, 0);

            return merged;
        }

        document.getElementById('btn-take-photo').addEventListener('click', () => {
            const merged = getMergedLayersCanvas();
            const link = document.createElement('a');
            link.download = `LiDAR_Sharp_Survey_${Date.now()}.png`;
            link.href = merged.toDataURL('image/png');
            link.click();
            captureStatus.innerText = "Foto opgeslagen (HD)!";
            setTimeout(() => captureStatus.innerText = "Stand-by", 2500);
        });

        let mediaRecorder, recordedChunks = [], isRecording = false;
        const btnRecord = document.getElementById('btn-record-video');
        btnRecord.addEventListener('click', () => {
            if (!isRecording) {
                const merged = document.createElement('canvas');
                merged.width = viewport.clientWidth;
                merged.height = viewport.clientHeight;
                const mCtx = merged.getContext('2d');
                const stream = merged.captureStream(30);

                function renderMergedStream() {
                    if (video.videoWidth > 0 && video.srcObject) {
                        mCtx.filter = getComputedStyle(video).filter;
                        mCtx.drawImage(video, 0, 0, merged.width, merged.height);
                        mCtx.filter = 'none';
                    }
                    if (isLidarActive) mCtx.drawImage(lidarCanvas, 0, 0);
                    
                    if (isRecording) requestAnimationFrame(renderMergedStream);
                }

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `LiDAR_Survey_Video_${Date.now()}.webm`;
                    a.click();
                    captureStatus.innerText = "Video gedownload!";
                };

                isRecording = true;
                mediaRecorder.start();
                renderMergedStream();
                btnRecord.classList.add('danger');
                btnRecord.innerText = "Stop Rec";
                captureStatus.innerText = "Opname loopt...";
            } else {
                isRecording = false;
                mediaRecorder.stop();
                btnRecord.classList.remove('danger');
                btnRecord.innerText = "🎥 Record";
            }
        });

        // === 6. HOOFD RENDER LOOP ===
        function drawAllLayers() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            const cx = w / 2;
            const cy = h / 2;

            if (!isSerialConnected && !isMobileSensorActive) {
                actueleAzimut = (actueleAzimut + 0.03) % 360;
            }

            const currentLidarDist = parseFloat(lidarRangeSlider.value);
            const currentUnit = HISTORICAL_UNITS[geoUnitSelector.value];
            const currentHistoricalVal = (currentLidarDist / currentUnit.factor).toFixed(2);

            lidarCtx.clearRect(0, 0, w, h);

            // --- LIDAR POINTCLOUD & METINGEN ---
            if (isLidarActive) {
                const lCtx = lidarCtx;
                lCtx.strokeStyle = 'rgba(0, 245, 212, 0.4)';
                lCtx.lineWidth = 1.2;

                const lidarRings = [40, 80, 130, 190];
                lidarRings.forEach((r, idx) => {
                    lCtx.beginPath();
                    lCtx.arc(cx, cy, r, 0, 2 * Math.PI);
                    lCtx.setLineDash([4, 4]);
                    lCtx.stroke();
                    lCtx.setLineDash([]);
                    
                    let distRing = (currentLidarDist * ((idx + 1) / 4)).toFixed(0);
                    lCtx.fillStyle = 'rgba(0, 245, 212, 0.7)';
                    lCtx.font = '8px "Courier New"';
                    lCtx.fillText(`${distRing}m`, cx + r + 4, cy - 2);
                });

                const numPoints = 18;
                for (let i = 0; i < numPoints; i++) {
                    const angle = (i * (360 / numPoints) + actueleAzimut * 1.5) * (Math.PI / 180);
                    const distRatio = 0.3 + 0.6 * Math.sin(i * 3.7 + actueleAzimut * 0.05);
                    const px = cx + Math.cos(angle) * (180 * distRatio);
                    const py = cy + Math.sin(angle) * (180 * distRatio);

                    lCtx.beginPath();
                    lCtx.arc(px, py, 2.5, 0, 2 * Math.PI);
                    lCtx.fillStyle = i % 2 === 0 ? 'var(--accent-cyan)' : 'var(--accent-green)';
                    lCtx.fill();
                }

                lCtx.strokeStyle = 'var(--accent-cyan)';
                lCtx.lineWidth = 1.5;
                lCtx.strokeRect(cx - 25, cy - 25, 50, 50);

                lCtx.fillStyle = 'rgba(15, 22, 28, 0.85)';
                lCtx.fillRect(cx + 35, cy - 35, 210, 52);
                lCtx.strokeStyle = 'var(--accent-cyan)';
                lCtx.strokeRect(cx + 35, cy - 35, 210, 52);

                lCtx.fillStyle = 'var(--accent-cyan)';
                lCtx.font = 'bold 10px "Courier New"';
                lCtx.fillText(`⚡ LIDAR METING ACTIEF`, cx + 42, cy - 20);
                lCtx.fillStyle = '#fff';
                lCtx.fillText(`METRISCH : ${currentLidarDist.toFixed(1)} m`, cx + 42, cy - 6);
                lCtx.fillStyle = 'var(--accent-yellow)';
                lCtx.fillText(`HISTORISCH: ${currentHistoricalVal} ${currentUnit.code} (${currentUnit.name})`, cx + 42, cy + 8);
            }

            requestAnimationFrame(drawAllLayers);
        }

        drawAllLayers();
    </script>
</body>
</html>
